<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three/build/three.module.min.js";

// ---------------- СЦЕНА ----------------
const scene = new THREE.Scene();

// Камера
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.z = 4;

// Рендер
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ---------------- ГРУППА ----------------
const group = new THREE.Group();
scene.add(group);

// Повернуть шар под углом
group.rotation.x = 0.35; // наклон вверх
group.rotation.y = 0.0;  // наклон вбок

// ---------------- ШАР (почти невидимый) ----------------
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 64, 64),
  new THREE.MeshPhysicalMaterial({
    color: 0x000000,
    metalness: 0.1,
    roughness: 0,
    transparent: true,
    opacity: 0.05, // прозрачность, которая возможно гасит контраст иконок
    clearcoat: 1,
    clearcoatRoughness: 0,
  })
);
group.add(sphere);

// ---------------- ИКОНКИ ----------------
const loader = new THREE.TextureLoader();
const icons = [];

//  -------- Добавление инонок по экватору !!!  -------- 

function addIcon(url, angle, link) {
  loader.load(url, texture => {
    const sprite = new THREE.Sprite(
  new THREE.SpriteMaterial({
    map: texture,
    color: 0xffffff,     // насыщенный цвет
    depthTest: false,    // чтобы не “разбавлялись” шаром
    depthWrite: false,   // важное дополнение для прозрачных объектов
    transparent: true,
    opacity: 1
  })
);
sprite.renderOrder = 1;

    const r = 1.7;
    sprite.position.set(
      Math.cos(angle) * r,
      0,
      Math.sin(angle) * r
    );

    sprite.scale.set(0.55, 0.55, 1);
    sprite.userData = { link, baseScale: 0.55 };
    sprite.renderOrder = 1;  // обязательно после шара

    group.add(sprite);
    icons.push(sprite);
  });
}

// Добавляем четыре иконки по эквартору
addIcon("https://cdn-icons-png.flaticon.com/512/25/25231.png", 0, "https://github.com/");

// ---------------- RAYCASTER ----------------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = null;

window.addEventListener("pointermove", (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

// Обычный клик (убрали, так как нам нужен клик без вращения)
/*window.addEventListener("click", () => {
  if (hovered) window.open(hovered.userData.link, "_blank");
});*/

// ---------------- DRAG ВРАЩЕНИЕ ----------------
let isPointerDown = false;
let hasDragged = false;
let startX = 0;
let startY = 0;

const DRAG_THRESHOLD = 6; // px — можно увеличить до 8–10

window.addEventListener("pointerdown", e => {
  isPointerDown = true;
  hasDragged = false;
  startX = e.clientX;
  startY = e.clientY;
});

window.addEventListener("pointermove", e => {
  if (!isPointerDown) return;

  const dx = e.clientX - startX;
  const dy = e.clientY - startY;

  // если движение заметное — это drag
  if (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD) {
    hasDragged = true;
  }

  if (hasDragged) {
    group.rotation.y += dx * 0.005;
    group.rotation.x += dy * 0.005;

    startX = e.clientX;
    startY = e.clientY;
  }
});

window.addEventListener("pointerup", () => {
  // ⛔ если был drag — НИКОГДА не открываем ссылку
  if (!hasDragged && hovered) {
    window.open(hovered.userData.link, "_blank");
  }

  isPointerDown = false;
});


// ---------------- АНИМАЦИЯ ----------------
function animate() {
  requestAnimationFrame(animate);

  // медленное авто-вращение
  group.rotation.y += 0.003;

  // raycaster для hover
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(icons);

  // обновляем hovered
  if (hits.length > 0) {
    hovered = hits[0].object;
    document.body.style.cursor = "pointer";
  } else {
    hovered = null;
    document.body.style.cursor = "default";
  }

  // плавное масштабирование иконок
  const hoverScale = 0.7;
  // Здесь меняется размер ИКОНКИ (также сменить размер стр. 143)
  const normalScale = 0.5;
  icons.forEach(icon => {
    const target = (icon === hovered) ? hoverScale : normalScale;
    icon.scale.x += (target - icon.scale.x) * 0.1;
    icon.scale.y += (target - icon.scale.y) * 0.1;
    icon.scale.z += (target - icon.scale.z) * 0.1;
  });

  // рендер сцены
  renderer.render(scene, camera);
}
animate();

// ---------------- RESIZE ----------------
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
